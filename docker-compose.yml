services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngaji
      POSTGRES_PASSWORD: ngaji
      POSTGRES_DB: ngaji
    ports:
      - "5435:5432"
    volumes:
      - ngaji_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngaji -d ngaji"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ngaji_postgres_data:
