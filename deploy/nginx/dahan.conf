# Reverse proxy for Dahan. Replace dahan.example.com with the real domain.
# Install: /etc/nginx/sites-available/dahan.conf, symlink into sites-enabled/.
# Certificates: `certbot certonly --nginx -d dahan.example.com` (or --nginx to let it edit this file).
#
# Security headers (CSP, HSTS, ...) come from the app itself; do not add them here, or they duplicate.
# The app binds 127.0.0.1:3000, so this proxy is the only way in. It OVERWRITES the forwarding
# headers with the real TCP peer so clients cannot spoof their IP (lib/http.ts#getClientIp).

server {
    listen 80;
    listen [::]:80;
    server_name dahan.example.com;

    # certbot --webroot / HTTP-01 fallback
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dahan.example.com;

    ssl_certificate     /etc/letsencrypt/live/dahan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dahan.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
